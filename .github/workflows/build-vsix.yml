name: Build & Release VS Code Extension (.vsix)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with all built .vsix files (tag v<version>)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-vsix-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build-vsix:
    name: Build VSIX (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            package_script: package:vsix:mac:arm64
          - target: win32-x64
            os: windows-latest
            package_script: package:vsix:win:x64
          - target: linux-x64
            os: ubuntu-latest
            package_script: package:vsix:linux:x64
    steps:
      - name: Configure git longpaths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Enable Developer Mode for symlinks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          $fs = (Get-Volume -DriveLetter $drive).FileSystem
          if ($fs -eq 'ReFS') {
            pnpm install --frozen-lockfile --package-import-method=clone
          } else {
            pnpm install --frozen-lockfile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DeepSeek Harness artifacts
        run: pnpm run build:artifacts:serial

      - name: Build VS Code extension bundle
        run: pnpm run build:vscode

      - name: Typecheck VS Code extension
        run: pnpm --filter dsh-vscode-harness run typecheck

      - name: Package VSIX (${{ matrix.target }})
        run: pnpm run ${{ matrix.package_script }}

      - name: Verify unpacked VSIX & native Host boot (${{ matrix.target }})
        run: pnpm --filter dsh-vscode-harness run verify:vsix --target ${{ matrix.target }}

      - name: Upload VSIX artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v7
        with:
          name: dsh-vscode-harness-${{ matrix.target }}
          path: apps/vscode/dist/dsh-vscode-harness-*-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 30

  summary-and-release:
    name: Checksums & GitHub Release
    needs: build-vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dsh-vscode-harness-*
          merge-multiple: true
          path: release-assets

      - name: Generate SHA256SUMS and job summary
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.vsix > SHA256SUMS.txt
          {
            echo "## DeepSeek Harness VS Code Extension (.vsix) Artifacts"
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for f in *.vsix; do
              size=$(numfmt --to=iec-i --suffix=B "$(stat -c%s "$f")")
              hash=$(awk -v file="$f" '$2 == file { print $1 }' SHA256SUMS.txt)
              echo "| \`$f\` | $size | \`$hash\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-vscode-harness-checksums
          path: release-assets/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('apps/vscode/package.json','utf8')).version")
            TAG="v${VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/*.vsix release-assets/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" release-assets/*.vsix release-assets/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "DeepSeek Harness VS Code ${TAG}" \
              --generate-notes
          fi
