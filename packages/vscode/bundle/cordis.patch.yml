# VS Code extension profile bundle patch.
# Layered AFTER @deepseek-ai/dsh-base and @deepseek-ai/dsh-web-app so official
# vendor bundles stay completely unmodified.

# Replace the standalone 3-column AppFrame and default sidebar with the compact
# VS Code split-surface layout and toolbar sidebar (no DSH logo, no bottom
# account/settings footer; Row 1 = New Session + plugin icons + Settings gear).
- id: ui-layout
  disabled: true

- id: ui-sidebar
  disabled: true

- id: entry-customization
  disabled: true

# Disable DeepSeek official account and official-only model onboarding so
# Settings exposes only third-party & custom model provider configuration (`llm-pi-ai`).
- id: deepseek-account
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: llm-deepseek
  disabled: true

- id: ui-settings-account
  disabled: true

- id: ui-account-notifications
  disabled: true

- id: ui-settings-session-log
  disabled: true

# Disable Web right-sidebar panels that overlap native VS Code IDE features
# (Explorer, Integrated Terminal, Editor preview, Browser).
# `ui-sidebar-right` itself remains mounted so Plan Review (`ui-plan`),
# Changed-Files Review (`ui-deliverables`), and Scheduled Tasks (`ui-schedule`)
# keep working seamlessly inside Editor Tabs.
- id: ui-sidebar-files
  disabled: true

- id: ui-sidebar-terminal
  disabled: true

- id: ui-sidebar-browser
  disabled: true

- id: ui-sidebar-documentpreview
  disabled: true

# Disable Desktop-only telemetry and browser-auto-open.
- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# Mount the VS Code split-surface layout + compact sidebar plugin.
- insert:
    - id: vscode-ui-layout
      name: '@deepseek-ai/dsh-vscode-ui-layout'
